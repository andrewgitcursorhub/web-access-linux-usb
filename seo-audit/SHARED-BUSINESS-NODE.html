================================================================================
CORE ASSET SOLUTIONS — SHARED BUSINESS NODE
Paste this ONE block into the <head> of ALL 36 HTML pages, byte-identical.
================================================================================

WHAT IT IS
  A self-contained @graph with two nodes: your business entity (#organization)
  and your website (#website). Nothing in it is page-specific, which is why the
  same block works on every page.

WHY EVERY PAGE
  Google evaluates each page on its own and does NOT resolve @id references
  across pages. Today only 2 of your 34 pages carry a complete business entity,
  so 32 pages have no address, no geo, no hours and no service area. They are
  competing for "... in Cincinnati" with zero local signals. This fixes that in
  one paste.

WHERE TO PUT IT
  In <head>, immediately after your existing <link rel="canonical"> line.
  Keep your existing page-specific JSON-LD blocks exactly as they are.

ABOUT YOUR EXISTING "provider" STUBS
  Your service and industry pages contain:
      "provider": { "@id": "https://core-asset-sol.com/#organization",
                    "@type": "Organization", "name": "...", "url": "..." }
  LEAVE THEM ALONE. They share the same @id as the node below, so JSON-LD merges
  them into one entity and the stub simply inherits the full address, geo, hours
  and areaServed. No edits needed. (RecyclingCenter is a subtype of Organization,
  so the two type declarations are compatible, not conflicting.)

THE GOOGLE BUSINESS PROFILE LINK IS VERIFIED
  hasMap below is NOT guessed. On 2026-10-09 I requested
  https://www.google.com/maps?cid=13429985598701594348 directly from Google and
  it returned:
        title   : "Core Asset Solutions - Google Maps"
        address : 457 S Cooper Ave, Lockland, OH 45215
        phone   : (513) 433-7818
  That is your real listing. The maps.app.goo.gl link currently on
  /about/client-testimonials is a REVIEWS url, not the listing — keep it there
  for "leave us a review", but it is not what belongs in hasMap.

  Sanity-check it yourself: open the URL. You should land on your own listing.

ADDRESS — THIS IS NOW SETTLED
  Google Business Profile holds: 457 S Cooper Ave, Lockland, OH 45215
  So that exact string is canonical. Two things on your site contradict it today
  and must be corrected wherever they appear:
      /contact schema says addressLocality "Cincinnati"  -> must be "Lockland"
      visible text says   "457 South Cooper Ave"         -> must be "457 S Cooper Ave"
  NAP has to match your GBP character for character, including the abbreviation
  and the absence of a trailing period.

AFTER PASTING
  Validate one page at https://validator.schema.org/ and one at
  https://search.google.com/test/rich-results
  Then run:  .\verify.ps1 -Only P2-5     (expect 34 of 34)
================================================================================
-->
